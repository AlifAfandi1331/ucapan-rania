<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Rania 🎀</title>
<style>
  body {
    margin: 0;
    background: linear-gradient(180deg, #fff0f5 0%, #ffe4ec 100%);
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    color: #d63384;
  }
  /* PAGE PIN */
  #pin-page {
    position: fixed; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: #fff0f5; z-index: 10; transition: opacity 0.5s;
  }
  #pin-page input {
    padding: 15px; font-size: 1.8em; text-align: center;
    border: 3px solid #ffb6c1; border-radius: 15px; width: 220px; letter-spacing: 8px;
    outline: none;
  }
  #pin-page input:focus { border-color: #ff69b4; box-shadow: 0 0 15px #ffb6c1; }
  /* CARD FLIP */
  #main-page { display: none; opacity: 0; transition: opacity 1s; }
  #main-page.show { display: block; opacity: 1; }
  .card-container { perspective: 1000px; width: 90%; max-width: 400px; margin: 50px auto; }
  .card { 
    position: relative; width: 100%; height: 500px; 
    transition: transform 0.8s; transform-style: preserve-3d; cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .front, .back {
    position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
    border-radius: 20px; box-shadow: 0 10px 30px rgba(255,182,193,0.4);
    background: white; padding: 20px; box-sizing: border-box; text-align: center;
  }
  .back { transform: rotateY(180deg); }
  .cat-img { width: 200px; border-radius: 15px; border: 4px solid #ffb6c1; }
  h1 { color: #ff69b4; }
  /* BALON */
  .balloon { position: fixed; bottom: -100px; width: 40px; height: 60px; background: #ffb6c1; border-radius: 50%; animation: float 6s infinite ease-in; }
  @keyframes float { to { bottom: 110%; transform: translateX(50px); opacity: 0; } }
</style>
</head>
<body>

<!-- 1. HALAMAN PIN -->
<div id="pin-page">
  <h1> Ini Kania bukan 👀</h1>
  <input type="password" id="pinInput" maxlength="6" placeholder="******" autofocus>
  <p style="color: red; display: none;" id="error">PIN salah!</p>
</div>

<!-- 2. HALAMAN KARTU -->
<div id="main-page">
  <div class="card-container">
    <div class="card" onclick="this.classList.toggle('flipped')">
      <!-- DEPAN -->
      <div class="front">
        <h1>Happy Birthday Raniaaa! 🎀</h1>
        <img src="rania.jpg" class="cat-img" alt="Rania">
        <p>Klik kartunya buat buka ucapan 💌</p>
      </div>
      <!-- BELAKANG -->
      <div class="back">
        <h1>Buat Rania 💗</h1>
        <p style="font-size: 1.1em;">
          Semoga di umur baru ini kamu selalu bahagia,<br>
          sehat, rezekinya lancar, dan semua doa baik terkabul ✨<br><br>
          Makasih udah jadi orang hebat.<br>
          <b>You’re gonna live forever in me</b> 🥺
        </p>
        <p><i>Klik lagi buat balik</i></p>
      </div>
    </div>
  </div>
  <audio id="bgm" src="lagu.mp3" loop></audio>
</div>

<script>
  const pinInput = document.getElementById('pinInput');
  const correctPin = '270701';

  // CEK OTOMATIS TIAP KETIK
  pinInput.addEventListener('input', function() {
    if(pinInput.value === correctPin){
      // PIN BENER
      document.getElementById('pin-page').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('pin-page').style.display = 'none';
        document.getElementById('main-page').classList.add('show');
        document.getElementById('bgm').play(); // Autoplay lagu
        createBalloons();
      }, 500); // delay biar ada efek fade
    } else if(pinInput.value.length === 6) {
      // PIN SALAH 6 digit
      document.getElementById('error').style.display = 'block';
      setTimeout(() => { pinInput.value = ''; document.getElementById('error').style.display = 'none'; }, 1000);
    }
  });
  
  // BALON
  function createBalloons(){
    for(let i=0; i<15; i++){
      let b = document.createElement('div');
      b.className = 'balloon';
      b.style.left = Math.random()*100 + 'vw';
      b.style.animationDelay = Math.random()*5 + 's';
      b.style.background = i%2==0 ? '#ffb6c1' : '#fff0f5';
      document.body.appendChild(b);
    }
  }
</script>
</body>
</html>
